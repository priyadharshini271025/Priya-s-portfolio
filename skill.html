<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skills — Priyadharshini</title>
<meta name="description" content="Core digital marketing skills: Google Ads, Meta Ads, SEO, analytics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{--bg:#000;--bg2:#0b0b0d;--card:#111114;--line:#26262c;--tx:#f5f5f7;--mu:#a8a8b3;--gold:#d4af37;--gold2:#f0d27a;--pu:#8b5cf6;--r:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#000}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.7 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif;line-height:1.1;margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
section{padding:110px 0;position:relative}
.sh{margin-bottom:56px;max-width:640px}
.sh h2{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:800;letter-spacing:-.02em}
.sh p{color:var(--mu);margin:14px 0 0}
.gold{background:linear-gradient(120deg,var(--gold2),var(--gold) 50%,var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
/* nav */
header{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:.3s}
header.s{background:rgba(0,0,0,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font:800 1.25rem 'Bricolage Grotesque',sans-serif}.logo i{color:var(--gold);font-style:normal}
.links{display:flex;gap:30px;list-style:none;margin:0;padding:0}
.links a{color:var(--mu);font-size:.95rem;font-weight:500;padding:6px 0;position:relative;transition:color .2s}
.links a:hover,.links a.on{color:var(--tx)}
.links a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);transition:width .25s}
.links a:hover::after,.links a.on::after{width:100%}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--tx);width:44px;height:44px;border-radius:12px;font-size:1.3rem;cursor:pointer}
@media(max-width:820px){.burger{display:block}
.links{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));left:0;right:0;background:#000;flex-direction:column;gap:0;padding:8px 24px 20px;border-bottom:1px solid var(--line);transform:translateY(-130%);transition:transform .35s}
.links.o{transform:none}.links a{display:block;padding:14px 0;font-size:1.1rem}}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:999px;font-weight:600;border:1px solid var(--gold);cursor:pointer;font:600 1rem Inter,sans-serif;transition:transform .2s,box-shadow .2s,background .2s,color .2s}
.btn.p{background:var(--gold);color:#000}.btn.p:hover{box-shadow:0 8px 30px rgba(212,175,55,.35)}
.btn.g{background:transparent;color:var(--tx);border-color:var(--line)}.btn.g:hover{border-color:var(--gold);color:var(--gold2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
/* hero */
#home{min-height:100vh;display:flex;align-items:center;padding:120px 0 80px;overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.glow{position:absolute;border-radius:50%;filter:blur(110px);opacity:.28;z-index:0;animation:dr 14s ease-in-out infinite alternate}
.g1{width:420px;height:420px;background:var(--pu);top:-80px;right:-60px}.g2{width:340px;height:340px;background:var(--gold);bottom:-100px;left:-80px;opacity:.16;animation-delay:-6s}
@keyframes dr{to{transform:translate(40px,30px) scale(1.15)}}
.hero{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(3.2rem,9vw,6.6rem);font-weight:800;letter-spacing:-.035em}
.role{font:600 clamp(1.2rem,2.6vw,1.7rem) 'Bricolage Grotesque',sans-serif;color:var(--gold2);margin:10px 0 28px}
.hero h2{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:700;max-width:520px;margin-bottom:18px}
.hero p{color:var(--mu);max-width:480px;margin:0 0 34px}
.cta{display:flex;flex-wrap:wrap;gap:14px}
.load>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}.load>*:nth-child(2){animation-delay:.1s}.load>*:nth-child(3){animation-delay:.2s}.load>*:nth-child(4){animation-delay:.3s}.load>*:nth-child(5){animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(28px)}}
.viz{position:relative;height:460px}
.fc{position:absolute;background:rgba(17,17,20,.88);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(0,0,0,.6);animation:fl 6s ease-in-out infinite}
.fc small{color:var(--mu);font-size:.78rem;display:block}.fc b{font:800 1.6rem 'Bricolage Grotesque',sans-serif}
.fc .up{color:#4ade80;font-size:.8rem;font-weight:600}
.c1{top:2%;left:4%;width:62%;animation-delay:0s;border-color:rgba(212,175,55,.45)}
.c2{top:38%;right:0;width:48%;animation-delay:-2s}
.c3{bottom:2%;left:0;width:50%;animation-delay:-4s;border-color:rgba(139,92,246,.5)}
.c4{top:0;right:6%;padding:12px 16px;animation-delay:-1s}.c5{bottom:14%;right:8%;padding:12px 16px;animation-delay:-3s}
@keyframes fl{50%{transform:translateY(-14px)}}
.viz svg{width:100%;height:60px;display:block;margin-top:8px}
.pl{stroke-dasharray:400;stroke-dashoffset:400;animation:dw 2.4s .6s forwards}@keyframes dw{to{stroke-dashoffset:0}}
.bars{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:8px}
.bars span{flex:1;background:linear-gradient(var(--pu),#4c2fa8);border-radius:4px 4px 0 0;transform-origin:bottom;animation:gr 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes gr{from{transform:scaleY(0)}}
@media(max-width:900px){.hero{grid-template-columns:1fr}.viz{height:380px}}
/* reveal */
.rv{opacity:0;transform:translateY(32px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about p{color:var(--mu);font-size:1.1rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;position:relative;transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 0 0 1px rgba(212,175,55,.3),0 18px 50px rgba(212,175,55,.1)}
.num{font:800 2.6rem 'Bricolage Grotesque',sans-serif;color:var(--gold2)}
.card .lb{color:var(--mu);font-size:.92rem}
@media(max-width:820px){.about{grid-template-columns:1fr}}
/* services */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);margin-bottom:20px;transition:transform .4s}
.card:hover .ic{transform:rotate(-8deg) scale(1.12)}
.card h3{font-size:1.35rem;margin-bottom:14px}
.card ul{list-style:none;margin:0;padding:0;color:var(--mu);font-size:.95rem}
.card li{padding:5px 0 5px 20px;position:relative}.card li::before{content:"";position:absolute;left:0;top:14px;width:8px;height:2px;background:var(--gold)}
/* skills */
#skills,#why{background:var(--bg2)}
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px 56px}
.sk .t{display:flex;justify-content:space-between;font-weight:500;margin-bottom:10px}.sk .t span:last-child{color:var(--gold2)}
.tr{height:8px;background:#1b1b20;border-radius:99px;overflow:hidden}
.tr i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--pu));transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
/* projects */
.fl{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:36px}
.fl button{background:none;border:1px solid var(--line);color:var(--mu);padding:10px 22px;border-radius:99px;cursor:pointer;font:500 .95rem Inter,sans-serif;transition:.2s}
.fl button:hover{color:var(--tx);border-color:var(--gold)}.fl button[aria-pressed=true]{background:var(--gold);color:#000;border-color:var(--gold)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.pj{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,border-color .3s,box-shadow .3s,opacity .35s}
.pj.hide{display:none}.pj.fade{opacity:0;transform:scale(.94)}
.im{height:180px;display:grid;place-items:center;font:700 .85rem Inter;color:rgba(255,255,255,.5);background:linear-gradient(135deg,#1a1530,#2a2210);position:relative;overflow:hidden}
.im::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(139,92,246,.4),transparent 55%);transition:transform .6s}
.pj:hover .im::after{transform:scale(1.3)}
.pb{padding:24px;display:flex;flex-direction:column;gap:12px;flex:1}
.pb h3{font-size:1.25rem}.pb p{color:var(--mu);font-size:.95rem;margin:0}
.tg{display:flex;flex-wrap:wrap;gap:8px}.tg span{font-size:.78rem;border:1px solid var(--line);padding:3px 12px;border-radius:99px;color:var(--mu)}
.mt{display:flex;gap:22px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mt b{display:block;font:800 1.3rem 'Bricolage Grotesque';color:var(--gold2)}.mt small{color:var(--mu);font-size:.78rem}
.pb a{margin-top:auto;color:var(--gold2);font-weight:600}.pb a:hover{text-decoration:underline}
/* contact */
#contact{overflow:hidden}
.ct{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;position:relative;z-index:1}
.ci{display:grid;gap:16px;margin-top:32px}
.ci a{display:flex;gap:16px;align-items:center;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);transition:.25s}
.ci a:hover{border-color:var(--gold);box-shadow:0 0 28px rgba(212,175,55,.15);transform:translateX(6px)}
.ci small{display:block;color:var(--mu);font-size:.8rem}
form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px;display:grid;gap:18px}
label{font-size:.9rem;font-weight:500;display:grid;gap:8px}
input,textarea{background:#000;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:14px 16px;font:inherit;transition:border-color .2s,box-shadow .2s;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.2)}
.er{color:#f87171;font-size:.82rem;min-height:1em;font-weight:400}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:#f87171}
.ok{color:#4ade80;font-weight:500;min-height:1.4em}
@media(max-width:820px){.ct{grid-template-columns:1fr}form{padding:22px}}
/* footer */
footer{border-top:1px solid var(--line);padding:48px 0 40px}
.ft{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:center}
.ft ul{display:flex;flex-wrap:wrap;gap:22px;list-style:none;margin:0;padding:0;color:var(--mu);font-size:.92rem}.ft ul a:hover{color:var(--gold2)}
.so{display:flex;gap:10px}.so a{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mu);transition:.2s}.so a:hover{border-color:var(--gold);color:var(--gold2);transform:translateY(-3px)}
.cp{color:var(--mu);font-size:.88rem;margin-top:28px;width:100%}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.pl{stroke-dashoffset:0}}

.top{padding-top:150px}

</style>
</head>
<body>
<header id="hd"><div class="wrap"><nav aria-label="Main">
<a href="index.html" class="logo" id="logo"></a>
<button class="burger" id="bg" aria-label="Open menu" aria-expanded="false">☰</button>
<ul class="links" id="nv"></ul>
</nav></div></header>
<main>
<section id="skills" class="top"><div class="wrap"><div class="sh rv"><h2>Core skills</h2><p>Where I spend most of my working hours.</p></div><div class="sk" id="sk"></div></div></section>
</main>
<footer><div class="wrap ft"><a href="index.html" class="logo" id="fLogo"></a><ul id="fn"></ul><div class="so" id="so"></div><p class="cp" id="cp"></p></div></footer>
<script>

 stats:[{n:90,s:"%",l:"Google Ads"},{n:90,s:"%",l:"Meta Ads"},{n:85,s:"%",l:"SEO"},{n:90,s:"%",l:"Digital Strategy"}],

  {i:"🧭",t:"Digital Marketing Strategy",l:["Marketing strategy","Audience research","Performance tracking","Data-driven optimization"]}],

 /* PLACEHOLDER projects: replace titles, text, metrics and links */
 projects:[
  {t:"Placeholder: Local Retail Search Campaign",c:"Google Ads",d:"Replace with a short description of the campaign goal and approach.",tags:["Google Ads","Search"],m:[["+00%","Conversions"],["0.0x","ROAS"]],url:"contact.html"},
  {t:"Placeholder: Lead Generation Funnel",c:"Meta Ads",d:"Replace with a short description of the audience and creative strategy.",tags:["Meta Ads","Lead Gen"],m:[["−00%","Cost per lead"],["000","Leads"]],url:"contact.html"},
  {t:"Placeholder: Website Organic Growth",c:"SEO",d:"Replace with a short description of the keyword and content plan.",tags:["SEO","Keyword Research"],m:[["+000%","Organic traffic"],["#0","Top ranking"]],url:"contact.html"},
  {t:"Placeholder: Product Launch Campaign",c:"Google Ads",d:"Replace with a short description of the launch plan.",tags:["Google Ads","Display"],m:[["0.0%","CTR"],["+00%","Sales"]],url:"contact.html"},
  {t:"Placeholder: Brand Awareness on Instagram",c:"Meta Ads",d:"Replace with a short description of the reach strategy.",tags:["Meta Ads","Instagram"],m:[["0.0M","Reach"],["−00%","CPM"]],url:"contact.html"},
  {t:"Placeholder: Technical SEO Audit",c:"SEO",d:"Replace with a short description of the audit findings and fixes.",tags:["SEO","Technical SEO"],m:[["+00","Pages indexed"],["−0s","Load time"]],url:"contact.html"}],

 contact:[{i:"✉️",l:"Email",v:"hello@example.com",h:"mailto:hello@example.com"},{i:"💼",l:"LinkedIn",v:"linkedin.com/in/your-profile",h:"https://linkedin.com/"},{i:"📸",l:"Instagram",v:"@your.handle",h:"https://instagram.com/"},{i:"📞",l:"Phone",v:"+91 00000 00000",h:"tel:+910000000000"}],
 social:[["in","https://linkedin.com/","LinkedIn"],["ig","https://instagram.com/","Instagram"],["@","mailto:hello@example.com","Email"]],
 nav:[["Home","index.html"],["About","about.html"],["Services","services.html"],["Skills","skills.html"],["Projects","projects.html"],["Contact","contact.html"]]
};
/* ===== RENDER ===== */
const D=document.createElement("div"),$=s=>document.querySelector(s)||D,E=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const logo=`${SITE.name}<i>.</i>`;$("#logo").innerHTML=$("#fLogo").innerHTML=logo;
$("#nv").innerHTML=SITE.nav.map(([a,b])=>`<li><a href="${b}">${a}</a></li>`).join("");
$("#heroTxt").innerHTML=`<h1>${E(SITE.name)}</h1><div class="role">${E(SITE.title)}</div><h2><span class="gold">${E(SITE.headline)}</span></h2><p>${E(SITE.sub)}</p><div class="cta"><a class="btn p" href="projects.html">View My Work</a><a class="btn g" href="contact.html">Contact Me</a></div>`;
$("#abT").textContent=SITE.aboutTitle;$("#abP").textContent=SITE.about;
$("#stats").innerHTML=SITE.stats.map((s,i)=>`<div class="card rv" style="--d:${i*.1}s"><div class="num"><span data-n="${s.n}">0</span>${s.s}</div><div class="lb">${E(s.l)}</div></div>`).join("");
$("#svc").innerHTML=SITE.services.map((s,i)=>`<article class="card rv" style="--d:${i*.1}s"><div class="ic">${s.i}</div><h3>${E(s.t)}</h3><ul>${s.l.map(x=>`<li>${E(x)}</li>`).join("")}</ul></article>`).join("");
$("#sk").innerHTML=SITE.skills.map(([n,v],i)=>`<div class="rv" style="--d:${i*.08}s"><div class="t"><span>${E(n)}</span><span>${v}%</span></div><div class="tr" role="progressbar" aria-label="${E(n)}" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><i data-w="${v}"></i></div></div>`).join("");
const cats=["All",...new Set(SITE.projects.map(p=>p.c))];
$("#fl").innerHTML=cats.map((c,i)=>`<button aria-pressed="${i==0}" data-c="${c}">${c}</button>`).join("");
$("#pg").innerHTML=SITE.projects.map(p=>`<article class="card pj" data-c="${p.c}"><div class="im">Project image placeholder</div><div class="pb"><h3>${E(p.t)}</h3><p>${E(p.d)}</p><div class="tg">${p.tags.map(t=>`<span>${E(t)}</span>`).join("")}</div><div class="mt">${p.m.map(m=>`<div><b>${E(m[0])}</b><small>${E(m[1])}</small></div>`).join("")}</div><a href="${p.url}">View Project</a></div></article>`).join("");

$("#fn").innerHTML=SITE.nav.map(([a,b])=>`<li><a href="${b}">${a}</a></li>`).join("");
$("#so").innerHTML=SITE.social.map(s=>`<a href="${s[1]}" aria-label="${s[2]}" rel="noopener">${s[0]}</a>`).join("");
$("#cp").textContent=`© 2026 ${SITE.name}. All Rights Reserved.`;
/* ===== BEHAVIOR ===== */
const cur=location.pathname.split("/").pop()||"index.html";document.querySelectorAll(".links a").forEach(a=>{if(a.getAttribute("href")==cur){a.classList.add("on");a.setAttribute("aria-current","page")}});
const hd=$("#hd"),nv=$("#nv"),bg=$("#bg");
addEventListener("scroll",()=>hd.classList.toggle("s",scrollY>20),{passive:true});
bg.onclick=()=>{const o=nv.classList.toggle("o");bg.setAttribute("aria-expanded",o);bg.textContent=o?"✕":"☰"};
nv.onclick=e=>{if(e.target.tagName=="A"){nv.classList.remove("o");bg.textContent="☰";bg.setAttribute("aria-expanded",false)}};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add("in");
 t.querySelectorAll("[data-w]").forEach(b=>b.style.width=b.dataset.w+"%");
 t.querySelectorAll("[data-n]").forEach(c=>{const n=+c.dataset.n,s=performance.now();(function f(x){const p=Math.min((x-s)/1400,1);c.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)});
 io.unobserve(t)}),{threshold:.2});
document.querySelectorAll(".rv").forEach(r=>io.observe(r));
$("#fl").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 document.querySelectorAll("#fl button").forEach(x=>x.setAttribute("aria-pressed",x==b));
 document.querySelectorAll(".pj").forEach(p=>{const show=b.dataset.c=="All"||p.dataset.c==b.dataset.c;
  if(show){p.classList.remove("hide");requestAnimationFrame(()=>p.classList.remove("fade"))}
  else{p.classList.add("fade");setTimeout(()=>p.classList.contains("fade")&&p.classList.add("hide"),300)}})};
/* form validation */
const fm=$("#fm"),rules={name:v=>v.trim().length>1||"Enter your name.",email:v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)||"Enter a valid email address, like name@example.com.",phone:v=>!v||/^[+\d][\d\s()-]{6,}$/.test(v)||"Use digits only, for example +91 98765 43210.",message:v=>v.trim().length>=10||"Write at least 10 characters."};
const chk=f=>{const r=rules[f.name](f.value),ok=r===true;f.setAttribute("aria-invalid",!ok);f.nextElementSibling.textContent=ok?"":r;return ok};
fm.querySelectorAll("input,textarea").forEach(f=>f.addEventListener("blur",()=>chk(f)));
fm.onsubmit=e=>{e.preventDefault();const ok=[...fm.querySelectorAll("input,textarea")].map(chk).every(Boolean),o=$("#ok");
 if(!ok){fm.querySelector("[aria-invalid=true]").focus();o.textContent="";return}
 /* Connect to your form service here (e.g. Formspree) */
 o.textContent="Message ready. Connect a form service to deliver it.";fm.reset()};
/* particles */
(()=>{if(!document.querySelector("#fx")||matchMedia("(prefers-reduced-motion:reduce)").matches)return;const c=$("#fx"),x=c.getContext("2d");let w,h,p=[];
 const rs=()=>{w=c.width=c.offsetWidth;h=c.height=c.offsetHeight;p=Array.from({length:Math.min(60,w/18|0)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.4,v:Math.random()*.25+.05,g:Math.random()>.5}))};
 rs();addEventListener("resize",rs);
 (function d(){x.clearRect(0,0,w,h);p.forEach(q=>{q.y-=q.v;if(q.y<0){q.y=h;q.x=Math.random()*w}x.fillStyle=q.g?"rgba(212,175,55,.5)":"rgba(139,92,246,.5)";x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill()});requestAnimationFrame(d)})()})();
