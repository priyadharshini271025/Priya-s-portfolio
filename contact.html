<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — Priyadharshini</title>
<meta name="description" content="Contact Priyadharshini, Digital Marketer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hd"><div class="wrap"><nav aria-label="Main">
<a href="index.html" class="logo" id="logo"></a>
<button class="burger" id="bg" aria-label="Open menu" aria-expanded="false">☰</button>
<ul class="links" id="nv"></ul>
</nav></div></header>
<main>
<section id="contact" class="top"><div class="glow g1" style="top:auto;bottom:-120px;right:-100px;opacity:.18"></div>
<div class="wrap ct">
 <div class="rv"><div class="sh" style="margin:0"><h2>Let’s Grow Your <span class="gold">Brand Together.</span></h2><p>Tell me about your goals and I’ll reply within two working days.</p></div><div class="ci" id="ci"></div></div>
 <form class="rv" id="fm" novalidate>
  <label>Name<input name="name" autocomplete="name" required><span class="er"></span></label>
  <label>Email<input name="email" type="email" autocomplete="email" required><span class="er"></span></label>
  <label>Phone<input name="phone" type="tel" autocomplete="tel"><span class="er"></span></label>
  <label>Message<textarea name="message" rows="5" required></textarea><span class="er"></span></label>
  <button class="btn p" type="submit">Send message</button><div class="ok" id="ok" role="status"></div>
 </form>
</div></section>
</main>
<footer><div class="wrap ft"><a href="index.html" class="logo" id="fLogo"></a><ul id="fn"></ul><div class="so" id="so"></div><p class="cp" id="cp"></p></div></footer>
<script src="site.js"></script>
</body>
</html>
